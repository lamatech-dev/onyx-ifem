syntax = "proto3";
package onyx.contracts.v1;
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
message DomainObjectRef { string aggregate_type = 1; string object_id = 2; }
message ActorContext { string principal_id = 1; string actor_type = 2; optional string device_id = 3; optional string membership_id = 4; }
message AuthorityProof { string proof_ref = 1; repeated string scope = 2; google.protobuf.Timestamp expires_at = 3; uint64 authority_epoch = 4; }
message CommandEnvelope { string command_id = 1; string operation_id = 2; string command_type = 3; uint32 schema_version = 4; string organization_id = 5; DomainObjectRef target = 6; optional uint64 expected_version = 7; optional uint64 expected_lifecycle_epoch = 8; optional uint64 expected_authority_epoch = 9; ActorContext actor_context = 10; AuthorityProof authority_proof = 11; google.protobuf.Timestamp issued_at = 12; map<string,uint64> vector_clock = 13; string correlation_id = 14; optional string causation_id = 15; google.protobuf.Struct payload = 16; }
message EventEnvelope { string event_id = 1; string event_type = 2; uint32 schema_version = 3; string organization_id = 4; DomainObjectRef aggregate = 5; uint64 aggregate_version = 6; uint64 lifecycle_epoch = 7; uint64 authority_epoch = 8; string operation_id = 9; ActorContext actor_context = 10; google.protobuf.Timestamp occurred_at = 11; google.protobuf.Timestamp recorded_at = 12; map<string,uint64> vector_clock = 13; string correlation_id = 14; optional string causation_id = 15; google.protobuf.Struct audit = 16; google.protobuf.Struct payload = 17; }
