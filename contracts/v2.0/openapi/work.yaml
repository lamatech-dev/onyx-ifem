      - message
      - correlation_id
      properties:
        code:
          type: string
        message:
          type: string
        correlation_id:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
