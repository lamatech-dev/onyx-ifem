openapi: 3.1.0
info:
  title: ONYX Work Command API
  version: 1.0.0
servers:
- url: https://api.onyx.invalid
paths:
  /v1/work/commands/CreateTask:
    post:
      operationId: CreateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../commands/work/CreateTask.schema.json
      responses:
        '202':
          description: Command accepted
        '400':
          description: Contract validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
