openapi: 3.1.0
info:
  title: ONYX Mission Command API
  version: 1.0.0
servers:
- url: https://api.onyx.invalid
paths:
  /v1/mission/commands/CreateMission:
    post:
      operationId: CreateMission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../commands/mission/CreateMission.schema.json
      responses:
        '202':
          description: Command accepted
        '400':
          description: Contract validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
