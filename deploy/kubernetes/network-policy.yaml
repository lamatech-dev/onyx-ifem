apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: onyx-ifem
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: onyx-ifem
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              onyx-ifem.io/access: "true"
          podSelector:
            matchLabels:
              onyx-ifem.io/client: "true"
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - ports:
        - port: 443
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchExpressions:
              - key: k8s-app
                operator: In
                values:
                  - kube-dns
                  - coredns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
