apiVersion: v1
kind: ConfigMap
metadata:
  name: onyx-ifem-config
data:
  ONYX_AUTH_AUDIENCE: onyx-ifem-api
  ONYX_AUTH_ISSUER: https://identity.example.invalid
  ONYX_AUTH_PUBLIC_KEY_PATH: /run/secrets/public-key.pem
  ONYX_HEADERS_TIMEOUT_MS: "5000"
  ONYX_KEEP_ALIVE_TIMEOUT_MS: "5000"
  ONYX_MAX_HEADER_BYTES: "16384"
  ONYX_MAX_HEADERS_COUNT: "100"
  ONYX_MAX_IN_FLIGHT: "100"
  ONYX_MAX_REQUESTS_PER_SOCKET: "1000"
  ONYX_OUTBOX_BATCH_SIZE: "10"
  ONYX_OUTBOX_ERROR_DELAY_MS: "5000"
  ONYX_OUTBOX_LEASE_MS: "120000"
  ONYX_OUTBOX_MAX_ATTEMPTS: "10"
  ONYX_OUTBOX_POLL_MS: "1000"
  ONYX_OUTBOX_TIMEOUT_MS: "10000"
  ONYX_RATE_LIMIT_CAPACITY: "120"
  ONYX_RATE_LIMIT_IDLE_TTL_MS: "600000"
  ONYX_RATE_LIMIT_MAX_CLIENTS: "10000"
  ONYX_RATE_LIMIT_REFILL_PER_SECOND: "20"
  ONYX_REQUEST_TIMEOUT_MS: "15000"
  ONYX_SOCKET_TIMEOUT_MS: "30000"
  ONYX_TRUST_PROXY: "false"
